<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            text-align: center;
        }

        section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 680px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        video {
            width: 100%;
            max-width: 640px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            background-color: #000;
        }

        audio {
            width: 100%;
            margin-top: 0.5rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Interactive Media Player Lounge</h1>

    <section>
        <h2>Featured Video: JavaScript Map Method Explained</h2>
        <video controls width="640">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <section>
        <h2>Featured Audio Track: Sailing Away</h2>
        <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
            Your browser does not support the audio element.
        </audio>
    </section>

</body>
</html>
